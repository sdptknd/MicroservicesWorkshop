events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-service:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
