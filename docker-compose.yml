version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hotel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - ./db-scripts:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  api:
    build: 
      context: ./monolith
    # deploy:
    #   replicas: 3
    # ports:
    #   - "3000-3002:3000"
    container_name: monolith_api
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=hotel_db
      - JWT_SECRET=mysecretkeyforhotelbooking
    volumes:
      - pdf_data:/app/pdfs
    depends_on:
      - db

volumes:
  pgdata:
  pdf_data:
